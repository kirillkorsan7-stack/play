name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project archive
        run: |
          unzip -q BlockWorld3D_Android_Project_v3.zip -d .
          cd BlockWorld3D
          test -f project.godot
          test -f export_presets.cfg

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64
          sudo mv godot-bin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Patch project for Godot 4.4 Android export
        working-directory: BlockWorld3D
        run: |
          sed -i 's/var x := \[-9.0, 9.0, 0.0\]\[i\]/var x: float = [-9.0, 9.0, 0.0][i]/' scripts/main.gd
          sed -i 's/var z := \[4.0, -3.0, -10.0\]\[i\]/var z: float = [4.0, -3.0, -10.0][i]/' scripts/main.gd
          sed -i 's/var delta := event.position - move_origin/var delta: Vector2 = event.position - move_origin/' scripts/main.gd
          sed -i 's/var delta := event.position - look_last/var delta: Vector2 = event.position - look_last/' scripts/main.gd
          sed -i 's/gradle_build\/use_gradle_build=false/gradle_build\/use_gradle_build=true/' export_presets.cfg
          sed -i 's/gradle_build\/target_sdk="35"/gradle_build\/target_sdk="34"/' export_presets.cfg
          grep -nE 'var x: float|var z: float|var delta: Vector2' scripts/main.gd
          grep -nE 'use_gradle_build|target_sdk' export_presets.cfg

      - name: Import project
        working-directory: BlockWorld3D
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: godot --headless --editor --path . --quit

      - name: Install Android build template
        working-directory: BlockWorld3D
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: godot --headless --editor --path . --install-android-build-template

      - name: Export APK
        working-directory: BlockWorld3D
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/BlockWorld3D.apk
          test -s build/BlockWorld3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockWorld3D-Android-APK
          path: BlockWorld3D/build/BlockWorld3D.apk
          if-no-files-found: error
